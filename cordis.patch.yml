# SoL-DSH bundle layer.
#
# Applied when a profile lists this bundle (for example after
# `dsh plugin --profile <name> add /path/to/SoL-DSH`). Every field below is
# validated by the plugin's exported Schemastery `Config`; a profile or
# home-level patch may override any of them by row id, or disable one mechanism
# without touching the other.
- insert:
    # Evidence-Preserving Reducer: delegate the first read of a long build or
    # test log to a reducer model, then accept the receipt only when every
    # quoted line is found byte for byte in the archived original.
    - id: sol-dsh-evidence-preserving-reducer
      name: 'sol-dsh'
      config:
        enabled: true
        minBytes: 4096
        maxChars: 600000
        maxOutputTokens: 2048
        timeoutMs: 90000

    # ObservationPack: send a large tool result in full for its first few
    # requests, then replace it with a placeholder naming an archived copy.
    - id: sol-dsh-observation-pack
      name: 'sol-dsh/observation-pack'
      config:
        enabled: true
        minBytes: 8192
        fullSends: 3
        maxPerPass: 8

    # Action Fusion: extend the mutation tools so one call can apply a change
    # and run its follow-up command, collapsing two turns into one.
    - id: sol-dsh-action-fusion
      name: 'sol-dsh/action-fusion'
      config:
        enabled: true
        tools: ['write', 'edit']
        shellTool: 'bash'
        defaultTimeoutMs: 120000

    # Online Context Compact: the stock backend with a cost model in front of
    # its automatic timing decision. The stock `compaction-basic` row is
    # disabled below, because a Cordis context holds exactly one
    # `ctx.compaction` implementation and two would collide.
    - id: sol-dsh-context-compact
      name: 'sol-dsh/context-compact'
      config:
        enabled: true
        # Billed cache-write cost relative to a cache read. 0 disables the
        # cache term, making every affordable compaction economic.
        cacheWriteReadRatio: 12.5
        # Tokens of headroom below the window at which compaction is forced
        # regardless of cost.
        windowReserveTokens: 16384
        # Estimated size of one replacement summary, before it is written.
        memoTokenEstimate: 1200

# Disable the stock compaction backend, which this bundle replaces.
#
# A patch may not change a row's `name` — the loader refuses that with a
# "name mismatch" warning and skips the entry — so the substitution is done in
# two steps: turn the stock row off here, and insert the replacement above.
# The row id and its `name` are left untouched, and a profile that wants the
# stock backend back can re-enable this row in its own later patch layer.
- id: compaction-basic
  disabled: true
